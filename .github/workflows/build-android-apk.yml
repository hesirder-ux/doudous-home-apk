name: Build Android APK (Capacitor + InAppBrowser)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout du code source
        uses: actions/checkout@v4

      - name: 2. Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Installation de Java JDK 21 (requis par Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Préparation de package.json et capacitor.config.json pour npm public
        run: |
          rm -f capacitor.config.ts
          cat << 'EOF' > package.json
          {
            "name": "doudous-home-apk",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "build": "vite build"
            },
            "dependencies": {
              "react": "^19.0.0",
              "react-dom": "^19.0.0",
              "lucide-react": "^0.475.0",
              "motion": "^12.4.7",
              "@capacitor/core": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/android": "^7.0.0",
              "cordova-plugin-inappbrowser": "^6.0.0"
            },
            "devDependencies": {
              "vite": "^6.2.0",
              "@vitejs/plugin-react": "^4.3.4",
              "@tailwindcss/vite": "^4.0.9",
              "tailwindcss": "^4.0.9",
              "typescript": "^5.7.3"
            }
          }
          EOF
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.doudoushome.courses",
            "appName": "Doudous Home",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": true
            }
          }
          EOF

      - name: 5. Installation des dépendances Web & Capacitor + InAppBrowser
        run: npm install --no-audit --no-fund

      - name: 6. Build de l'application React/Vite dans /dist
        run: npm run build

      - name: 7. Génération et synchronisation du projet Android Capacitor
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: 8. Compilation de l'APK Android (assembleDebug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Publication du fichier APK prêt à installer sur téléphone
        uses: actions/upload-artifact@v4
        with:
          name: doudous-home-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
